<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="sd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="100%" stop-color="#111e38"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#sd-bg)"/>
  <g transform="translate(80, 50)">
    <rect width="1040" height="575" rx="16" fill="#0b1222" stroke="rgba(56,189,248,0.25)" stroke-width="1.5"/>
    <rect width="1040" height="48" rx="16" fill="#0f1a30"/>
    <rect y="32" width="1040" height="16" fill="#0f1a30"/>
    <circle cx="26" cy="24" r="6" fill="#ef4444"/>
    <circle cx="46" cy="24" r="6" fill="#f59e0b"/>
    <circle cx="66" cy="24" r="6" fill="#10b981"/>
    <text x="520" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">SmartDoc RAG Engine // Hybrid Lexical + Vector Semantic Retrieval</text>

    <g transform="translate(40, 75)">
      <rect width="960" height="60" rx="12" fill="#13203b" stroke="rgba(0,245,212,0.3)" stroke-width="1.5"/>
      <circle cx="36" cy="30" r="10" fill="#00f5d4" opacity="0.2"/>
      <text x="60" y="36" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="600">"How does the multi-tenant PostgreSQL connection routing prevent tenant cross-contamination?"</text>
      <rect x="820" y="12" width="120" height="36" rx="8" fill="#00f5d4"/>
      <text x="880" y="34" fill="#090e1a" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">Retrieve &rarr;</text>
    </g>

    <g transform="translate(40, 160)">
      <rect width="460" height="330" rx="12" fill="#0f182c" stroke="rgba(255,255,255,0.06)"/>
      <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">1,536-Dimensional Vector Proximity Space</text>
      
      <g transform="translate(30, 50)">
        <line x1="20" y1="220" x2="380" y2="220" stroke="#334155" stroke-width="1"/>
        <line x1="20" y1="20" x2="20" y2="220" stroke="#334155" stroke-width="1"/>
        
        <circle cx="120" cy="80" r="6" fill="#00f5d4"/>
        <circle cx="135" cy="95" r="5" fill="#00f5d4" opacity="0.7"/>
        <circle cx="110" cy="90" r="4" fill="#00f5d4" opacity="0.7"/>
        <circle cx="145" cy="75" r="5" fill="#00f5d4" opacity="0.8"/>
        <text x="160" y="85" fill="#00f5d4" font-family="sans-serif" font-size="11" font-weight="700">Doc #84 (Score: 0.941)</text>

        <circle cx="280" cy="150" r="5" fill="#818cf8"/>
        <circle cx="295" cy="165" r="4" fill="#818cf8" opacity="0.7"/>
        <circle cx="270" cy="145" r="5" fill="#818cf8" opacity="0.7"/>
        <text x="295" y="145" fill="#818cf8" font-family="sans-serif" font-size="11">Auth Spec (0.782)</text>

        <circle cx="320" cy="60" r="4" fill="#f59e0b"/>
        <circle cx="340" cy="75" r="4" fill="#f59e0b" opacity="0.6"/>
        <text x="340" y="60" fill="#f59e0b" font-family="sans-serif" font-size="11">Stripe Docs (0.512)</text>
      </g>
    </g>

    <g transform="translate(520, 160)">
      <rect width="480" height="330" rx="12" fill="#0f182c" stroke="rgba(255,255,255,0.06)"/>
      <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Augmented Response with Grounded Citations</text>

      <g transform="translate(20, 50)">
        <rect width="440" height="150" rx="8" fill="#14213d" stroke="rgba(0,245,212,0.2)"/>
        <text x="16" y="25" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">"Tenant isolation is enforced dynamically at the Django ORM middleware layer.</text>
        <text x="16" y="45" fill="#f8fafc" font-family="sans-serif" font-size="12">The request context sets the current tenant_id on threading.local(),</text>
        <text x="16" y="65" fill="#f8fafc" font-family="sans-serif" font-size="12">and all subsequent queries automatically inject `SET LOCAL app.current_tenant`</text>
        <text x="16" y="85" fill="#f8fafc" font-family="sans-serif" font-size="12">into PostgreSQL session parameters, satisfying row-level security (RLS)."</text>
        <rect x="16" y="110" width="130" height="24" rx="4" fill="rgba(0,245,212,0.15)"/>
        <text x="24" y="126" fill="#00f5d4" font-family="sans-serif" font-size="11" font-weight="700">&bull; Source: arch_spec.pdf</text>
      </g>

      <g transform="translate(20, 220)">
        <rect width="135" height="75" rx="6" fill="#131e36"/>
        <text x="12" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">RETRIEVAL TIME</text>
        <text x="12" y="48" fill="#10b981" font-family="sans-serif" font-size="20" font-weight="800">142 ms</text>
        <text x="12" y="66" fill="#64748b" font-family="sans-serif" font-size="10">ChromaDB + HNSW</text>

        <rect x="150" width="135" height="75" rx="6" fill="#131e36"/>
        <text x="162" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">CHUNKS PARSED</text>
        <text x="162" y="48" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="800">184,500</text>
        <text x="162" y="66" fill="#64748b" font-family="sans-serif" font-size="10">Sliding 512-token</text>

        <rect x="300" width="140" height="75" rx="6" fill="#131e36"/>
        <text x="312" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">HALLUCINATION RATE</text>
        <text x="312" y="48" fill="#00f5d4" font-family="sans-serif" font-size="20" font-weight="800">0.0%</text>
        <text x="312" y="66" fill="#10b981" font-family="sans-serif" font-size="10">Strict Citation Gate</text>
      </g>
    </g>

    <g transform="translate(40, 508)">
      <rect width="960" height="42" rx="6" fill="#0e1628"/>
      <text x="20" y="26" fill="#94a3b8" font-family="sans-serif" font-size="12">Stack:</text>
      <text x="75" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">Python &bull; Django REST Framework &bull; OpenAI text-embedding-3 &bull; ChromaDB Vector Store &bull; Celery</text>
    </g>
