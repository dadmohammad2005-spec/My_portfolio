<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="sn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#090f20"/>
    </linearGradient>
    <linearGradient id="sn-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="intense-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#sn-bg)"/>
  
  <!-- Cyberpunk Ambience Glows -->
  <circle cx="600" cy="300" r="280" fill="#00f5d4" opacity="0.06" filter="url(#intense-glow)"/>
  <circle cx="950" cy="180" r="200" fill="#ec4899" opacity="0.05" filter="url(#intense-glow)"/>

  <!-- Application Window Frame -->
  <g transform="translate(80, 45)">
    <rect width="1040" height="585" rx="16" fill="#070c18" stroke="rgba(0,245,212,0.25)" stroke-width="1.5"/>
    
    <!-- Top Browser Bar -->
    <rect width="1040" height="48" rx="16" fill="#0c1426"/>
    <rect y="32" width="1040" height="16" fill="#0c1426"/>
    <circle cx="26" cy="24" r="6" fill="#ef4444"/>
    <circle cx="46" cy="24" r="6" fill="#f59e0b"/>
    <circle cx="66" cy="24" r="6" fill="#10b981"/>
    
    <rect x="340" y="10" width="360" height="28" rx="14" fill="#040711" stroke="rgba(255,255,255,0.08)"/>
    <text x="520" y="28" fill="#00f5d4" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">snake-arcade.dev // snake-pro-ultimate</text>

    <!-- Game HUD Header -->
    <g transform="translate(40, 65)">
      <!-- Title -->
      <text x="0" y="28" fill="#ffffff" font-family="'Orbitron', sans-serif, monospace" font-size="20" font-weight="900" letter-spacing="2">SNAKE PRO</text>
      <text x="175" y="28" fill="#00f5d4" font-family="'Orbitron', sans-serif, monospace" font-size="14" font-weight="700">&bull; ULTIMATE EDITION</text>
      
      <!-- Score Pill 1 -->
      <g transform="translate(540, 5)">
        <rect width="120" height="36" rx="8" fill="#0f1c33" stroke="rgba(0,245,212,0.3)"/>
        <text x="60" y="15" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">CURRENT SCORE</text>
        <text x="60" y="30" fill="#00f5d4" font-family="'Orbitron', monospace" font-size="14" font-weight="800" text-anchor="middle">2,480</text>
      </g>

      <!-- Score Pill 2 -->
      <g transform="translate(680, 5)">
        <rect width="120" height="36" rx="8" fill="#0f1c33" stroke="rgba(236,72,153,0.3)"/>
        <text x="60" y="15" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">HIGH SCORE</text>
        <text x="60" y="30" fill="#ec4899" font-family="'Orbitron', monospace" font-size="14" font-weight="800" text-anchor="middle">8,950</text>
      </g>

      <!-- Speed Pill -->
      <g transform="translate(820, 5)">
        <rect width="140" height="36" rx="8" fill="#0f1c33" stroke="rgba(56,189,248,0.3)"/>
        <text x="70" y="15" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">DIFFICULTY &bull; LEVEL</text>
        <text x="70" y="30" fill="#38bdf8" font-family="'Orbitron', monospace" font-size="13" font-weight="800" text-anchor="middle">HYPER (LVL 7)</text>
      </g>
    </g>

    <!-- Main Arcade Canvas Simulation -->
    <g transform="translate(40, 120)">
      <!-- Canvas Box -->
      <rect width="960" height="380" rx="14" fill="#030610" stroke="rgba(0,245,212,0.35)" stroke-width="2"/>
      
      <!-- Grid Lines Inside Game Board -->
      <g stroke="rgba(0,245,212,0.04)" stroke-width="1">
        <line x1="0" y1="40" x2="960" y2="40"/><line x1="0" y1="80" x2="960" y2="80"/><line x1="0" y1="120" x2="960" y2="120"/>
        <line x1="0" y1="160" x2="960" y2="160"/><line x1="0" y1="200" x2="960" y2="200"/><line x1="0" y1="240" x2="960" y2="240"/>
        <line x1="0" y1="280" x2="960" y2="280"/><line x1="0" y1="320" x2="960" y2="320"/><line x1="0" y1="360" x2="960" y2="360"/>
        <line x1="80" y1="0" x2="80" y2="380"/><line x1="160" y1="0" x2="160" y2="380"/><line x1="240" y1="0" x2="240" y2="380"/>
        <line x1="320" y1="0" x2="320" y2="380"/><line x1="400" y1="0" x2="400" y2="380"/><line x1="480" y1="0" x2="480" y2="380"/>
        <line x1="560" y1="0" x2="560" y2="380"/><line x1="640" y1="0" x2="640" y2="380"/><line x1="720" y1="0" x2="720" y2="380"/>
        <line x1="800" y1="0" x2="800" y2="380"/><line x1="880" y1="0" x2="880" y2="380"/>
      </g>

      <!-- Snake Body Segments (Glowing Neon) -->
      <!-- Tail to Body -->
      <rect x="200" y="240" width="36" height="36" rx="8" fill="#008f7a" opacity="0.6"/>
      <rect x="240" y="240" width="36" height="36" rx="8" fill="#00a896" opacity="0.75"/>
      <rect x="280" y="240" width="36" height="36" rx="8" fill="#02c39a" opacity="0.85"/>
      <rect x="320" y="240" width="36" height="36" rx="8" fill="#00f5d4"/>
      <rect x="360" y="240" width="36" height="36" rx="8" fill="#00f5d4"/>
      <!-- Turn Upward -->
      <rect x="360" y="200" width="36" height="36" rx="8" fill="#00f5d4"/>
      <rect x="360" y="160" width="36" height="36" rx="8" fill="#00f5d4"/>
      <!-- Turn Right -->
      <rect x="400" y="160" width="36" height="36" rx="8" fill="#00f5d4"/>
      <rect x="440" y="160" width="36" height="36" rx="8" fill="#00f5d4"/>
      <rect x="480" y="160" width="36" height="36" rx="8" fill="#00f5d4"/>
      <rect x="520" y="160" width="36" height="36" rx="8" fill="#00f5d4"/>
      <!-- Snake Head with Eyes -->
      <g transform="translate(560, 160)" filter="url(#neon)">
        <rect width="36" height="36" rx="10" fill="#2bf8de"/>
        <circle cx="26" cy="11" r="4" fill="#040711"/>
        <circle cx="26" cy="25" r="4" fill="#040711"/>
        <!-- Tongue -->
        <line x1="36" y1="18" x2="48" y2="18" stroke="#ef4444" stroke-width="2"/>
        <line x1="48" y1="18" x2="52" y2="14" stroke="#ef4444" stroke-width="1.5"/>
        <line x1="48" y1="18" x2="52" y2="22" stroke="#ef4444" stroke-width="1.5"/>
      </g>

      <!-- Food Orb (Glowing Apple Particle) -->
      <g transform="translate(720, 160)" filter="url(#neon)">
        <circle cx="18" cy="18" r="14" fill="#ef4444"/>
        <circle cx="14" cy="14" r="5" fill="#fca5a5"/>
        <path d="M18 4 Q 22 0, 26 2" stroke="#10b981" stroke-width="2.5" fill="none"/>
      </g>

      <!-- Bonus Crystal Food -->
      <g transform="translate(840, 240)" filter="url(#neon)">
        <polygon points="18,4 32,18 18,32 4,18" fill="#ec4899"/>
        <circle cx="18" cy="18" r="4" fill="#ffffff"/>
      </g>

      <!-- Floating Controls Helper -->
      <g transform="translate(30, 290)">
        <rect width="250" height="65" rx="10" fill="rgba(12,20,38,0.85)" stroke="rgba(255,255,255,0.08)"/>
        <text x="15" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">CONTROLS</text>
        <text x="15" y="48" fill="#00f5d4" font-family="'JetBrains Mono', monospace" font-size="11">[W][A][S][D] / Arrow Keys</text>
        <text x="175" y="48" fill="#f8fafc" font-family="sans-serif" font-size="10">&bull; Pause: [P]</text>
      </g>
    </g>

    <!-- Bottom Tech Spec -->
    <g transform="translate(40, 520)">
      <rect width="960" height="42" rx="8" fill="#0a1020" stroke="rgba(255,255,255,0.06)"/>
      <text x="20" y="26" fill="#00f5d4" font-family="sans-serif" font-weight="700" font-size="12">Interactive Game Engine:</text>
      <text x="200" y="26" fill="#94a3b8" font-family="sans-serif" font-size="12">HTML5 Canvas 2D Context &bull; RequestAnimationFrame Engine &bull; Collision Detection Matrix &bull; Sound Synthesis &bull; Django View Engine</text>
    </g>
  </g>
</svg>