        <text x="16" y="28" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="700">STAGE 4 &bull; EMIT</text>
        <text x="16" y="50" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">BroadcastEvent</text>
        <text x="16" y="70" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">Channels WS</text>
