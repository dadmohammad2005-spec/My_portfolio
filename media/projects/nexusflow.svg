        <text x="16" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">5,000 batch size</text>
      </g>

      <line x1="690" y1="122" x2="750" y2="122" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4"/>

