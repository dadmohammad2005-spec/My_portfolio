      <text x="80" y="25" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="12">Django 5.1 &bull; Celery 5.4 &bull; Redis 7 Cluster &bull; WebSockets &bull; Gunicorn &bull; WhiteNoise</text>
    </g>
