<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="gd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14"/>
      <stop offset="100%" stop-color="#0e1526"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#gd-bg)"/>
  <g transform="translate(80, 50)">
    <rect width="1040" height="575" rx="16" fill="#0a101d" stroke="rgba(0,245,212,0.25)" stroke-width="1.5"/>
    <rect width="1040" height="48" rx="16" fill="#0e172a"/>
    <rect y="32" width="1040" height="16" fill="#0e172a"/>
    <circle cx="26" cy="24" r="6" fill="#ef4444"/>
    <circle cx="46" cy="24" r="6" fill="#f59e0b"/>
    <circle cx="66" cy="24" r="6" fill="#10b981"/>
    <text x="520" y="30" fill="#00f5d4" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">GitDeploy CLI // Zero-Downtime Container Rollout &amp; Rollback Tool</text>

    <g transform="translate(40, 75)">
      <rect width="960" height="415" rx="10" fill="#070b14" stroke="rgba(255,255,255,0.06)"/>
      
      <g transform="translate(25, 35)" font-family="'JetBrains Mono', monospace" font-size="13">
        <text x="0" y="0" fill="#38bdf8">$ gitdeploy deploy --environment production --tag v2.8.4 --zero-downtime</text>
        
        <text x="0" y="30" fill="#94a3b8">[10:14:02] [INFO] Connecting to Docker daemon socket at unix:///var/run/docker.sock</text>
        <text x="0" y="55" fill="#94a3b8">[10:14:03] [PULL] Pulling image registry.cloud.internal/app:v2.8.4 [sha256:8f4c21a...]</text>
        
        <text x="0" y="85" fill="#10b981">[10:14:05] [OK] Image verified and signed with Cosign key</text>
        <text x="0" y="110" fill="#94a3b8">[10:14:06] [STEP 1/4] Spawning blue-green container 'app-production-green-01' on port :8081</text>
        
        <text x="0" y="140" fill="#f59e0b">[10:14:08] [PROBE] Running HTTP health probe: GET http://127.0.0.1:8081/health/ ...</text>
        <text x="0" y="165" fill="#10b981">[10:14:09] [HEALTHY] 200 OK (latency: 4.2ms) - Database connection verified</text>
        
        <text x="0" y="195" fill="#38bdf8">[10:14:10] [STEP 2/4] Executing zero-downtime Nginx upstream reload</text>
        <text x="0" y="220" fill="#10b981">[10:14:10] [TRAFFIC SWITCH] 100% of incoming requests routed to green container</text>
        
        <text x="0" y="250" fill="#94a3b8">[10:14:12] [STEP 3/4] Draining active connections from blue container 'app-production-blue-00'</text>
        <text x="0" y="275" fill="#10b981">[10:14:15] [STOPPED] Blue container safely stopped. Snapshotted for instant 1-second rollback.</text>
        
        <text x="0" y="310" fill="#00f5d4" font-weight="700">[10:14:15] [SUCCESS] Zero-Downtime Deployment Finished in 13.4s with ZERO dropped packets.</text>
        <text x="0" y="340" fill="#ffffff">&gt; Deployment status: ACTIVE | Version: v2.8.4 | Commit: 9c412f8 | Upstream: Healthy</text>
      </g>
    </g>

    <g transform="translate(40, 508)">
      <rect width="960" height="42" rx="6" fill="#0e172a"/>
      <text x="20" y="26" fill="#94a3b8" font-family="sans-serif" font-size="12">Tools:</text>
      <text x="75" y="26" fill="#00f5d4" font-family="'JetBrains Mono', monospace" font-size="12">Python 3.12 &bull; Docker Engine API &bull; Click CLI &bull; Rich Terminal UI &bull; Nginx &bull; Linux Systemd</text>
    </g>
  </g>
