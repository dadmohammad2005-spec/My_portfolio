<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="ppt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1b"/>
      <stop offset="100%" stop-color="#141829"/>
    </linearGradient>
    <linearGradient id="ppt-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d24726"/>
      <stop offset="100%" stop-color="#e05b38"/>
    </linearGradient>
    <linearGradient id="pdf-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b30b00"/>
      <stop offset="100%" stop-color="#e5252a"/>
    </linearGradient>
    <linearGradient id="ppt-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17223b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#ppt-bg)"/>
  
  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <circle cx="950" cy="200" r="220" fill="#e05b38" opacity="0.08" filter="url(#glow)"/>
  <circle cx="250" cy="480" r="200" fill="#e5252a" opacity="0.06" filter="url(#glow)"/>

  <!-- Application Window Frame -->
  <g transform="translate(80, 45)">
    <rect width="1040" height="585" rx="16" fill="#0b1323" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>
    
    <!-- Top Browser Bar -->
    <rect width="1040" height="48" rx="16" fill="#0f1a30"/>
    <rect y="32" width="1040" height="16" fill="#0f1a30"/>
    <circle cx="26" cy="24" r="6" fill="#ef4444"/>
    <circle cx="46" cy="24" r="6" fill="#f59e0b"/>
    <circle cx="66" cy="24" r="6" fill="#10b981"/>
    
    <rect x="340" y="10" width="360" height="28" rx="14" fill="#070c18" stroke="rgba(255,255,255,0.06)"/>
    <text x="520" y="28" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">ppt-converter.tool // win32-com-pipeline</text>

    <!-- Header Section -->
    <g transform="translate(40, 75)">
      <rect width="42" height="42" rx="10" fill="url(#ppt-orange)"/>
      <text x="21" y="28" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle">P</text>
      <text x="56" y="22" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="16">PowerPoint to PDF Converter</text>
      <text x="56" y="38" fill="#94a3b8" font-family="sans-serif" font-size="11">Automated batch slide deck conversion engine powered by Python &amp; pywin32 COM automation</text>
    </g>

    <!-- Main Transformation Flow -->
    <g transform="translate(40, 145)">
      <!-- Left Box: Source PPT/PPTX -->
      <g transform="translate(0, 0)">
        <rect width="380" height="260" rx="14" fill="url(#ppt-card)" stroke="rgba(210,71,38,0.3)" stroke-width="1.5"/>
        <rect width="380" height="42" rx="14" fill="#1b253d"/>
        <rect y="28" width="380" height="14" fill="#1b253d"/>
        
        <rect x="18" y="10" width="22" height="22" rx="4" fill="url(#ppt-orange)"/>
        <text x="29" y="25" fill="#fff" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">P</text>
        <text x="48" y="26" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Source Presentation (.pptx / .ppt)</text>

        <!-- Slide Preview Mock -->
        <g transform="translate(25, 60)">
          <rect width="330" height="170" rx="10" fill="#0c1424" stroke="rgba(255,255,255,0.06)"/>
          <!-- Slide Inner Content -->
          <rect x="20" y="20" width="160" height="14" rx="4" fill="#e05b38"/>
          <rect x="20" y="42" width="220" height="8" rx="2" fill="#475569"/>
          <rect x="20" y="56" width="180" height="8" rx="2" fill="#334155"/>
          
          <rect x="20" y="80" width="130" height="65" rx="6" fill="#16223e"/>
          <rect x="170" y="80" width="140" height="65" rx="6" fill="#16223e"/>
          <text x="85" y="118" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Slide Deck [1 of 32]</text>
          <text x="240" y="118" fill="#00f5d4" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Vector Shapes</text>
        </g>
      </g>

      <!-- Center Transformation Arrow & Engine -->
      <g transform="translate(415, 60)">
        <circle cx="65" cy="70" r="48" fill="#0f1b32" stroke="rgba(0,245,212,0.4)" stroke-width="2"/>
        <!-- Animated arrow symbol -->
        <path d="M45 70 L80 70 M70 58 L82 70 L70 82" stroke="#00f5d4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="65" y="145" fill="#00f5d4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">COM Pipeline</text>
        <text x="65" y="162" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Auto Vectorization</text>
      </g>

      <!-- Right Box: Result PDF -->
      <g transform="translate(580, 0)">
        <rect width="380" height="260" rx="14" fill="url(#ppt-card)" stroke="rgba(229,37,42,0.3)" stroke-width="1.5"/>
        <rect width="380" height="42" rx="14" fill="#1b253d"/>
        <rect y="28" width="380" height="14" fill="#1b253d"/>
        
        <rect x="18" y="10" width="22" height="22" rx="4" fill="url(#pdf-red)"/>
        <text x="29" y="25" fill="#fff" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle">PDF</text>
        <text x="48" y="26" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Target Document (.pdf)</text>

        <!-- Document Preview Mock -->
        <g transform="translate(25, 60)">
          <rect width="330" height="170" rx="10" fill="#0c1424" stroke="rgba(255,255,255,0.06)"/>
          <!-- PDF Pages Visualizer -->
          <rect x="25" y="18" width="120" height="135" rx="6" fill="#ffffff" opacity="0.95"/>
          <rect x="35" y="30" width="60" height="6" rx="2" fill="#e5252a"/>
          <rect x="35" y="44" width="90" height="4" rx="1" fill="#94a3b8"/>
          <rect x="35" y="52" width="100" height="4" rx="1" fill="#cbd5e1"/>
          <rect x="35" y="60" width="85" height="4" rx="1" fill="#cbd5e1"/>
          <rect x="35" y="75" width="100" height="40" rx="3" fill="#e2e8f0"/>

          <!-- Success Badge -->
          <rect x="170" y="35" width="135" height="30" rx="6" fill="rgba(16,185,129,0.18)" stroke="rgba(16,185,129,0.3)"/>
          <text x="237" y="54" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">✓ 100% High Fidelity</text>

          <text x="170" y="90" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">300 DPI Export</text>
          <text x="170" y="106" fill="#94a3b8" font-family="sans-serif" font-size="10">Lossless Text &amp; Vector</text>
          <rect x="170" y="122" width="135" height="28" rx="6" fill="#e5252a"/>
          <text x="237" y="140" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Download PDF</text>
        </g>
      </g>
    </g>

    <!-- Bottom Feature Badges -->
    <g transform="translate(40, 435)">
      <rect width="960" height="90" rx="12" fill="#0d1527" stroke="rgba(255,255,255,0.06)"/>
      <g transform="translate(25, 20)">
        <rect width="280" height="50" rx="8" fill="#131e36"/>
        <text x="16" y="22" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">⚡ Automated Conversion</text>
        <text x="16" y="38" fill="#94a3b8" font-family="sans-serif" font-size="10">Batch PPT/PPTX slide processing</text>

        <rect x="310" width="280" height="50" rx="8" fill="#131e36"/>
        <text x="326" y="22" fill="#00f5d4" font-family="sans-serif" font-size="11" font-weight="700">🎯 Native COM Architecture</text>
        <text x="326" y="38" fill="#94a3b8" font-family="sans-serif" font-size="10">pywin32 PowerPoint automation</text>

        <rect x="620" width="290" height="50" rx="8" fill="#131e36"/>
        <text x="636" y="22" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="700">🌐 Web Service Integration</text>
        <text x="636" y="38" fill="#94a3b8" font-family="sans-serif" font-size="10">Django upload &amp; instant streaming</text>
      </g>
    </g>
  </g>
</svg>