{% extends "admin/index.html" %}
{% load i18n static %}

{% block content %}
<div style="background: linear-gradient(135deg, #10192e, #16223e); border: 1px solid rgba(0, 245, 212, 0.25); border-radius: 8px; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
  <div>
    <h2 style="margin: 0; font-size: 1.25rem; font-weight: 700; color: #f8fafc; display: flex; align-items: center; gap: 8px;">
      <span style="color: #00f5d4;">Portfolio System Administration</span>
    </h2>
    <p style="margin: 4px 0 0; color: #94a3b8; font-size: 0.85rem;">
      You can manage raw database entries below or launch the dedicated, responsive executive dashboard.
    </p>
  </div>
  <div style="display: flex; gap: 10px; align-items: center;">
    <a href="{% url 'dashboard:home' %}" style="background: linear-gradient(135deg, #00f5d4, #0d9488); color: #090e1a; font-weight: 700; font-size: 0.85rem; padding: 8px 16px; border-radius: 6px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 10px rgba(0,245,212,0.3);">
      ⚡ Launch Frontend Dashboard
    </a>
    <a href="{% url 'core:home' %}" target="_blank" style="background: rgba(255,255,255,0.06); color: #f8fafc; font-weight: 600; font-size: 0.85rem; padding: 8px 14px; border-radius: 6px; text-decoration: none; border: 1px solid rgba(255,255,255,0.1);">
      View Live Portfolio &rarr;
    </a>
  </div>
</div>

{{ block.super }}
{% endblock %}
